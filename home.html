<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube 2</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

</head>
<body>
    <header class="head">
        <button id="btn-menu"><i class="fa-solid fa-bars"></i></button>
        <img src="" alt="Logo-Youtube">
        <input type="text">
        <img src="" alt="Logo-Usuario">
    </header>

    <div class="main">
        <div class="video-box">
            <img src="hulk.avif" alt="img-video" class="img-video">
            <p class="video-title">titulo do video</p>
            <div class="video-user">
                <div class="user">
                    <img src="OIP.jpg" alt="img-usuario">
                    <div class="user-description">
                        <p class="user-name">Nome do usuário</p>
                        <p class="user-subs">Inscrito</p>
                    </div>
                </div>
            <button class="subscribe">Inscreva-se</button>
            </div>
        </div>

    </div>

    <div class="overlay" id="overlay"></div>
    <aside class="menu" id="menu">
        <div class="menu-header">
            <p>Menu</p>
            <button class="btn-close" id="btn-close">X</button>
        </div>
    </aside>
</body>
</html>
